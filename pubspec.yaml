name: famille_budget
description: Famille Budget - revenus, dépenses, stock de riz, synchronisation multi-appareils (Android, Windows, macOS, Linux).
publish_to: "none"
version: 1.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  sqlite3_flutter_libs: any
  path: ^1.9.0
  path_provider: ^2.1.5
  fl_chart: ^0.69.2
  share_plus: ^10.1.4
  file_picker: ^10.3.10
  uuid: ^4.5.1
  connectivity_plus: any
  qr_flutter: any
  mobile_scanner: any

flutter:
  uses-material-design: true
